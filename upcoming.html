<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.classList.add('js');</script>
    <title>REVKØ — Nouvelle sortie dans 1 mois</title>
    <meta name="description" content="REVKØ — Nouvelle sortie dans 1 mois. Hard Techno / Industrial / Uptempo.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=12">
    <style>
        .countdown { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 40px 0; }
        .countdown .unit { text-align: center; min-width: 90px; }
        .countdown .num { font-family: var(--display); font-size: clamp(3rem, 8vw, 6rem); font-weight: 900; line-height: 1; color: var(--signal); text-shadow: 0 0 30px rgba(255,45,26,.4); }
        .countdown .label { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--steel); margin-top: 8px; }
        .upcoming-hero { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
        .upcoming-title { font-family: var(--display); font-size: clamp(3rem, 12vw, 9rem); font-weight: 900; line-height: 0.9; letter-spacing: -0.02em; margin: 20px 0; }
        .upcoming-sub { color: var(--steel); font-size: 1.1rem; max-width: 600px; }
        .presave { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="bg" aria-hidden="true">
        <div class="bg-grain"></div>
        <div class="bg-vignette"></div>
    </div>
    <canvas class="rain" id="rain" aria-hidden="true"></canvas>
    <div class="spotlight" id="spotlight" aria-hidden="true"></div>

    <main id="main">
        <section class="upcoming-hero">
            <p class="eyebrow"><span>00</span>Nouvelle sortie</p>
            <h1 class="upcoming-title">REVKØ</h1>
            <p class="upcoming-sub">Le prochain son arrive. Prépare-toi. <span>Sortie dans :</span></p>

            <div class="countdown" id="countdown">
                <div class="unit"><div class="num" id="cd-days">00</div><div class="label">Jours</div></div>
                <div class="unit"><div class="num" id="cd-hours">00</div><div class="label">Heures</div></div>
                <div class="unit"><div class="num" id="cd-mins">00</div><div class="label">Minutes</div></div>
                <div class="unit"><div class="num" id="cd-secs">00</div><div class="label">Secondes</div></div>
            </div>

            <div class="presave">
                <a class="btn btn-primary" href="https://distrokid.com/hyperfollow/revk/aladdin-night-hard-techno-remix-2" target="_blank" rel="noopener"><span>Pré-save / Écouter</span><i class="fa-brands fa-spotify" aria-hidden="true"></i></a>
                <a class="btn btn-ghost" href="index.html"><span>Retour</span><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>
            </div>
        </section>
    </main>

    <script src="script.js?v=12"></script>
    <script>
        // Date de sortie : 1 mois jour pour jour
        const releaseDate = new Date();
        releaseDate.setMonth(releaseDate.getMonth() + 1);
        // fixe à minuit
        releaseDate.setHours(0,0,0,0);

        function updateCountdown() {
            const now = new Date();
            const diff = releaseDate - now;
            if (diff <= 0) {
                document.getElementById('countdown').innerHTML = '<div class="num">C\'EST SORTI !</div>';
                return;
            }
            const days = Math.floor(diff / (1000*60*60*24));
            const hours = Math.floor((diff / (1000*60*60)) % 24);
            const mins = Math.floor((diff / (1000*60)) % 60);
            const secs = Math.floor((diff / 1000) % 60);
            document.getElementById('cd-days').textContent = String(days).padStart(2,'0');
            document.getElementById('cd-hours').textContent = String(hours).padStart(2,'0');
            document.getElementById('cd-mins').textContent = String(mins).padStart(2,'0');
            document.getElementById('cd-secs').textContent = String(secs).padStart(2,'0');
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
